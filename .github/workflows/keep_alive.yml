name: 24/7 Keep Streamlit Cloud Awake

on:
  schedule:
    # Chay dinh ky moi 4 gio (0h, 4h, 8h, 12h, 16h, 20h UTC) de Streamlit Cloud khong bao gio bi sleep
    - cron: '0 */4 * * *'
  workflow_dispatch: # Cho phep bam "Run workflow" thu cong tren GitHub

jobs:
  keep-alive:
    name: Wake & Keep Alive Streamlit App
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Keep Streamlit App Awake
        run: python scripts/keep_app_awake.py https://quanlyvattucfc.streamlit.app
