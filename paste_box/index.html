<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ctrl+V Paste Box</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #paste-container {
            width: 100%;
            height: 104px;
            border: 1.5px dashed #CBD5E1;
            background: #F8FAFC;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            user-select: none;
        }
        #paste-container:focus, #paste-container:hover {
            border-color: #0284C7;
            background: #F0F9FF;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.14);
        }
        .icon {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .main-text {
            color: #0F172A;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-align: center;
        }
        .kbd {
            background: #F0F9FF;
            border: 1px solid #BAE6FD;
            color: #0369A1;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            margin: 0 4px;
            font-weight: 700;
        }
        .sub-text {
            color: #64748B;
            font-size: 0.76rem;
            margin-top: 4px;
        }
        .status-text {
            margin-top: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #059669;
            display: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div id="paste-container" tabindex="0">
        <div class="icon">📋</div>
        <div class="main-text">BẤM VÀO ĐÂY RỒI NHẤN <span class="kbd">Ctrl + V</span> ĐỂ DÁN ẢNH</div>
        <div class="sub-text">Cắt hình phiếu giao hàng (Win + Shift + S) rồi click dán trực tiếp</div>
        <div class="status-text" id="status">✓ ĐÃ NHẬN ẢNH! ĐANG NẠP VÀO HỆ THỐNG...</div>
    </div>

    <script src="streamlit-component-lib.js"></script>
    <script>
        const container = document.getElementById('paste-container');
        const status = document.getElementById('status');

        function handleImageFile(file) {
            status.style.display = 'block';
            status.innerText = '✓ ĐÃ NHẬN ẢNH TỪ CLIPBOARD! ĐANG NẠP...';
            const reader = new FileReader();
            reader.onload = function(e) {
                Streamlit.setComponentValue(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function extractImageFromClipboard(e) {
            const clipboardData = e.clipboardData || window.clipboardData;
            if (!clipboardData) return false;
            const items = clipboardData.items;
            if (!items) return false;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    handleImageFile(file);
                    e.preventDefault();
                    return true;
                }
            }
            return false;
        }

        container.addEventListener('paste', function(e) {
            extractImageFromClipboard(e);
        });

        window.addEventListener('paste', function(e) {
            extractImageFromClipboard(e);
        });

        try {
            if (window.parent && window.parent.document) {
                window.parent.document.addEventListener('paste', function(e) {
                    extractImageFromClipboard(e);
                });
            }
        } catch (err) {}

        container.addEventListener('mouseenter', () => {
            container.focus();
        });

        let handshakeInterval = setInterval(() => {
            try {
                Streamlit.setComponentReady();
                Streamlit.setFrameHeight(110);
            } catch(e) {}
        }, 300);

        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function() {
            if (handshakeInterval) {
                clearInterval(handshakeInterval);
                handshakeInterval = null;
            }
            Streamlit.setFrameHeight(110);
        });

        try {
            Streamlit.setComponentReady();
            Streamlit.setFrameHeight(110);
        } catch(e) {}
    </script>
</body>
</html>
