[server]
address = "0.0.0.0"
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#2ECC71"
backgroundColor = "#07130D"
secondaryBackgroundColor = "#0E2118"
textColor = "#FFFFFF"
font = "sans serif"
